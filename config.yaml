# https://gohugo.io/getting-started/configuration/#all-configuration-settings
baseURL: 'https://nerves-project.org/'
locale: 'en-us'
title: 'Nerves Project'
Copyright: 'The Nerves Project Authors'

# https://gohugo.io/variables/site/#the-siteparams-variable
params:
  description: >
    Nerves is the open-source embedded framework for shipping products with
    Elixir. Made for teams putting devices in the field, and happy to help with
    weekend projects too.
  dateFormat: "January 2, 2006"
  github: https://github.com/nerves-project
  discord: https://discord.gg/7TqSpepHw7
  docs: https://hexdocs.pm/nerves

# https://gohugo.io/content-management/menus
# main: the header nav. The footer columns are footer_learn, footer_project,
# footer_community and footer_blog.
menu:
  main:
    - name: Docs
      url: https://hexdocs.pm/nerves
      weight: 1
      params:
        external: true
    - name: Learn
      url: /learn/
      weight: 2
    - name: Code
      url: /code/
      weight: 3
    - name: Related projects
      url: /related_projects/
      weight: 4
    - name: Community
      url: /community/
      weight: 5
    - name: Blog
      url: /blog/
      weight: 6
    - name: Videos
      url: /videos/
      weight: 7
    - name: Articles
      url: /articles/
      weight: 8
    - name: Sponsors
      url: /sponsors/
      weight: 9
  footer_learn:
    - name: Docs
      url: https://hexdocs.pm/nerves
      weight: 1
    - name: Getting started
      url: /getting_started/
      weight: 2
    - name: Books
      url: /learn/#books
      weight: 3
    - name: Videos
      url: /videos/
      weight: 4
  footer_project:
    - name: Code
      url: /code/
      weight: 1
    - name: Cases
      url: /cases/
      weight: 2
    - name: Articles
      url: /articles/
      weight: 3
    - name: Related projects
      url: /related_projects/
      weight: 4
    - name: Sponsors
      url: /sponsors/
      weight: 5
  footer_community:
    - name: Discord
      url: https://discord.gg/7TqSpepHw7
      weight: 1
    - name: GitHub
      url: https://github.com/nerves-project
      weight: 2
    - name: Meetup
      url: https://www.meetup.com/nerves
      weight: 3
    - name: Bluesky
      url: https://bsky.app/profile/nerves-project.org
      weight: 4
    - name: Mastodon
      url: https://fosstodon.org/@NervesProject
      weight: 5
  footer_blog:
    - name: Subscribe
      url: /blog/#subscribe
      weight: 1
    - name: All posts
      url: /blog/
      weight: 2
    - name: RSS feed
      url: /blog/index.xml
      weight: 3

# https://gohugo.io/content-management/taxonomies/
taxonomies:
  tag: tags

# https://gohugo.io/news/0.60.0-relnotes/
markup:
  goldmark:
    renderer:
      unsafe: true

# HTML content files (sponsors page, newsletter archive) are denied by default
# since Hugo v0.162.0. Allow them, but keep the default deny for Org.
# https://gohugo.io/configuration/security/
security:
  allowContent:
    - '! ^text/org$'

# Keep tag names as written (e.g. "ssh", not "Ssh"), like older Hugo versions did.
capitalizeListTitles: false
