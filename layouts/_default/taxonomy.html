{{ define "main" }}
{{ partial "page-head" (dict "eyebrow" .Params.eyebrow "title" .Title "lede" .Params.lede) }}
<div class="wrap section--tight">
  {{ with .Content }}<div class="prose prose--page">{{ . }}</div>{{ end }}
  <ul class="simple-list">
    {{ range .Paginator.Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span>{{ .Date.Format "Jan 2, 2006" }}</span></li>
    {{ end }}
  </ul>
  {{ partial "pager" .Paginator }}
</div>
{{ end }}
