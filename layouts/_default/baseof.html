<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    {{ partial "head" . }}
    {{ block "head" . }}{{ end }}
  </head>
  <body class="page-{{ .Type }}{{ if .IsHome }} page-home{{ end }}">
    {{ block "header" . }}{{ partial "site-header" . }}{{ end }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ block "footer" . }}{{ partial "site-footer" . }}{{ end }}
  </body>
</html>
