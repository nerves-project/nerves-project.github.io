/* VM configuration file: OpenSBI + U-Boot booting Nerves from an A/B disk image */
{
    version: 1,
    machine: "riscv64",
    memory_size: 128,
    bios: "opensbi.bin",
    kernel: "u-boot.bin",
    cmdline: "",
    drive0: { file: "disk/f5d0c0f6fae76a9c/blk.txt" },
    eth0: { driver: "user" },
    /* the board (board.js): GPIO lines and an I2C adapter, in the page */
    gpio0: { lines: ["LED_SLOT_A", "LED_SLOT_B", "LED_READY",
                     "BUTTON_1", "BUTTON_2", "BUTTON_3"] },
    i2c0: {},
}
